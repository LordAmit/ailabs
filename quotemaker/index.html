<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Maker - High Resolution Book Quote Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- PWA configuration -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffd54f">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Local offline dependencies -->
    <script src="lib/marked.min.js"></script>
    <script src="lib/html2canvas.min.js"></script>
</head>

<body>
    <div class="app-container show-editor">
        <!-- Mobile Tab Switcher -->
        <div class="mobile-tab-bar">
            <button type="button" class="tab-btn active" id="tab-editor">Editor</button>
            <button type="button" class="tab-btn" id="tab-preview">Preview</button>
        </div>

        <!-- Sidebar Controls -->
        <aside class="sidebar-controls" aria-label="Controls Sidebar">
            <div class="sidebar-header">
                <h1>Quote Maker</h1>
                <p>Create elegant book quotes for sharing</p>
            </div>

            <div class="sidebar-content-scrollable">
                <div class="control-group">
                    <label for="markdown-input">Content (Markdown)</label>
                    <textarea id="markdown-input" placeholder="Type your markdown here..."></textarea>
                </div>

                <details class="design-settings">
                    <summary>Customization Settings</summary>
                    <div class="settings-content">
                        <!-- Header Style Group -->
                        <div class="settings-section">
                            <h3 class="settings-section-title">Header Style</h3>

                            <div class="control-group inline-group">
                                <div class="control-item">
                                    <label for="color-header">Header Highlight</label>
                                    <input type="color" id="color-header" value="#ffd54f">
                                </div>
                            </div>

                            <div class="control-group">
                                <label for="font-header-select">Header Font</label>
                                <select id="font-header-select">
                                    <option value="'Playfair Display', Georgia, serif">Playfair Display (Elegant Serif)</option>
                                    <option value="Lora, Georgia, serif">Lora (Classic Serif)</option>
                                    <option value="Georgia, serif">Georgia</option>
                                    <option value="Inter, system-ui, sans-serif">Inter (Modern Sans)</option>
                                    <option value="system-ui, sans-serif">System Sans-Serif</option>
                                    <option value="'Courier New', monospace">Courier Monospace</option>
                                </select>
                            </div>

                            <div class="control-group">
                                <label for="font-size-header">Header Size (<span id="font-size-header-val">36</span>px)</label>
                                <div class="font-size-control">
                                    <button type="button" class="btn-adjust" id="btn-header-dec"
                                        aria-label="Decrease header font size">-</button>
                                    <input type="range" id="font-size-header" min="16" max="72" value="36">
                                    <button type="button" class="btn-adjust" id="btn-header-inc"
                                        aria-label="Increase header font size">+</button>
                                </div>
                            </div>
                        </div>

                        <!-- Body Style Group -->
                        <div class="settings-section">
                            <h3 class="settings-section-title">Body Style</h3>

                            <div class="control-group inline-group">
                                <div class="control-item">
                                    <label for="color-bold">Bold Color</label>
                                    <input type="color" id="color-bold" value="#a3e635">
                                </div>
                                <div class="control-item">
                                    <label for="color-italic">Underline Color</label>
                                    <input type="color" id="color-italic" value="#ef4444">
                                </div>
                            </div>

                            <div class="control-group">
                                <label for="font-body-select">Body Font</label>
                                <select id="font-body-select">
                                    <option value="Lora, Georgia, serif">Lora (Classic Serif)</option>
                                    <option value="'Playfair Display', Georgia, serif">Playfair Display</option>
                                    <option value="Georgia, serif">Georgia</option>
                                    <option value="Inter, system-ui, sans-serif">Inter (Modern Sans)</option>
                                    <option value="system-ui, sans-serif">System Sans-Serif</option>
                                    <option value="'Courier New', monospace">Courier Monospace</option>
                                </select>
                            </div>

                            <div class="control-group">
                                <label for="font-size-body">Body Size (<span id="font-size-body-val">28</span>px)</label>
                                <div class="font-size-control">
                                    <button type="button" class="btn-adjust" id="btn-body-dec"
                                        aria-label="Decrease body font size">-</button>
                                    <input type="range" id="font-size-body" min="16" max="72" value="28">
                                    <button type="button" class="btn-adjust" id="btn-body-inc"
                                        aria-label="Increase body font size">+</button>
                                </div>
                            </div>
                        </div>

                        <!-- Global Design & Assets Group -->
                        <div class="control-group">
                            <label for="bg-select">Background Template</label>
                            <select id="bg-select">
                                <option value="template-1">Template 1</option>
                                <option value="template-2">Template 2</option>
                                <option value="template-3">Template 3</option>
                                <option value="template-4">Template 4</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label for="watermark-input">Watermark Text</label>
                            <input type="text" id="watermark-input" value="@username" placeholder="e.g. @username">
                            <div class="checkbox-item">
                                <input type="checkbox" id="watermark-toggle" checked>
                                <label for="watermark-toggle">Show Watermark</label>
                            </div>
                        </div>

                        <div class="control-group">
                            <label for="font-upload">Upload Custom Font (.ttf, .otf, .woff, .woff2)</label>
                            <div class="file-upload-wrapper">
                                <input type="file" id="font-upload" accept=".ttf,.otf,.woff,.woff2">
                                <span class="file-upload-btn">Choose Font File</span>
                            </div>
                            <div id="uploaded-fonts-list" class="uploaded-fonts-list">
                                <!-- Dynamic list of custom fonts -->
                            </div>
                        </div>

                        <div class="control-group">
                            <button type="button" id="btn-reset-design" class="btn-secondary">Reset Colors & Sizes</button>
                        </div>
                    </div>
                </details>
            </div>

            <div class="sidebar-actions-sticky">
                <button type="button" id="btn-download" class="btn-primary">Download Image (3:4)</button>

                <div class="sidebar-footer">
                    <button type="button" id="btn-reset" class="btn-danger">Reset App Data</button>
                </div>
            </div>
        </aside>

        <!-- Preview Area -->
        <main class="preview-area" aria-label="Preview Container">
            <div class="preview-aspect-ratio-box">
                <!-- The actual DOM node we capture for exporting (exactly 3:4) -->
                <div id="export-canvas" class="export-canvas template-1">
                    <div class="canvas-inner">
                        <div id="rendered-content" class="rendered-content">
                            <!-- Dynamic Markdown Render Content -->
                        </div>
                        <div id="canvas-watermark" class="canvas-watermark">@username</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
